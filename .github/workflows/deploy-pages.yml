name: Deploy StudyHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp -R public/studyhub/. _site/
          cp public/favicon.svg _site/favicon.svg
          cp public/apple-touch-icon.png _site/apple-touch-icon.png
          cp public/studyhub-icon-192.png _site/studyhub-icon-192.png
          cp public/studyhub-icon-512.png _site/studyhub-icon-512.png
          cp public/site.webmanifest _site/site.webmanifest
          cp public/studyhub-og-v2.png _site/studyhub-og-v2.png
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
